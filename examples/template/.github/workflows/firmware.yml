# Builds the firmware on every push and pull request, and releases it to the 203 community (the standard
# release of every firmware on CardenzaHAL, docs/FIRMWARE-PROJECT.md "Publish from CI"):
#
#   push to main         dev     <version.txt>-dev.<run number>
#   tag vX.Y.Z           stable  X.Y.Z         (equal to version.txt; CHANGELOG.md's "## X.Y.Z" is its notes)
#   tag vX.Y.Z-beta.N    beta    X.Y.Z-beta.N
#
# Trusted publishing, no secret: publish the first version by hand (203c publish) and commit 203.json with
# its code, then link this repository and this workflow file on the firmware's page (自动发布 / Trusted
# publishing) and turn beta and dev on there.
name: Firmware
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.5
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write          # trusted publishing: the job's OIDC token
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory '*'    # the container's user does not own the checkout
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py build
      # The simulator version (Play on the community) is built by the publish step when Emscripten is here.
      - name: Emscripten
        if: github.event_name == 'push'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install latest && ~/emsdk/emsdk activate latest
      # The HAL's action, at the HAL commit this firmware builds with (the submodule).
      - name: Publish to the 203 community
        if: github.event_name == 'push'
        uses: ./components/CardenzaHAL/.github/actions/community-publish
        with:
          elf: build/my_firmware.elf

  # On your own Cardenza (optional): a self-hosted runner on a computer with a Cardenza on its USB cable (labels
  # self-hosted, cardenza; Linux or macOS, Node 18+) installs each build through the device's 203 Launcher and
  # checks that it starts: the job fails at a panic or when the line never comes (203c log, no sign-in).
  # on-device:
  #   needs: firmware
  #   if: github.event_name == 'push'
  #   runs-on: [self-hosted, cardenza]
  #   steps:
  #     - uses: actions/download-artifact@v4      # the BIN: add an upload-artifact step for build/my_firmware.bin above
  #       with: {name: bin}
  #     - run: npm install -g 203c
  #     - run: 203c flash --bin my_firmware.bin --json
  #     - run: 203c log --until "my_firmware .* ready" --seconds 60 --json
