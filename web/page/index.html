<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230e0e10'/%3E%3Crect x='3' y='3' width='10' height='6' fill='%23e8e8e0'/%3E%3C/svg%3E">
  <title>@CARDENZA_TITLE@ · Cardenza simulator</title>
  <!-- The CardenzaHAL web target's page. tools/cardenza_web.py fills the placeholders (HTML-escaped):
       @CARDENZA_MODULE@ the firmware's module script, @CARDENZA_TITLE@ its name, @CARDENZA_VERSION@ its
       version. cardenza-sim.js builds the device from data-* below; there is no inline script, so a
       host's strict CSP (script-src 'self') still works. -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #c8c8c0; touch-action: none;
           -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #stage { position: fixed; inset: 0; background: #000; outline: none; }
    /* The board in its own 700 x 400 units (Cardenza is 7:4), scaled to fit and letterboxed on black. */
    #board { position: absolute; left: 0; top: 0; width: 700px; height: 400px; transform-origin: 0 0;
             background: #0e0e10; border-radius: 22px; box-shadow: inset 0 0 0 1px #222226; }
    .brand { position: absolute; left: 22px; top: 22px; font-size: 13px; letter-spacing: 3px; color: #8a8a84; }
    .brand small { display: block; margin-top: 6px; font-size: 10px; letter-spacing: 0.5px; color: #5c5c58;
                   max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hint { position: absolute; right: 22px; top: 22px; font-size: 10px; letter-spacing: 1px; color: #ffd030;
            border: 1px solid #5a4a10; border-radius: 4px; padding: 3px 6px; }
    .hint[hidden] { display: none; }
    .ir { position: absolute; right: 26px; top: 168px; width: 8px; height: 8px; border-radius: 50%; background: #2a1414;
          transition: background 0.25s; }
    .ir.on { background: #ff3048; transition: none; }
    .bezel { position: absolute; left: 202px; top: 16px; width: 296px; height: 170px; border-radius: 8px;
             background: #050506; box-shadow: inset 0 0 0 1px #1c1c20; }
    #screen { position: absolute; left: 4px; top: 4px; width: 288px; height: 162px; image-rendering: pixelated;
              image-rendering: crisp-edges; background: #000; }
    .overlay { position: absolute; inset: 4px; display: flex; align-items: center; justify-content: center; text-align: center;
               font-size: 10px; line-height: 1.5; color: #e8e8e0; background: rgba(0, 0, 0, 0.82); padding: 8px; white-space: pre-wrap;
               overflow: hidden; }
    .overlay[hidden] { display: none; }
    .overlay.panic { color: #ff8090; align-items: flex-start; justify-content: flex-start; text-align: left; font-size: 8px; }
    .home { position: absolute; left: 540px; top: 72px; width: 56px; height: 56px; border-radius: 50%; background: #1b1b1e;
            box-shadow: inset 0 0 0 1px #2c2c30; display: flex; align-items: center; justify-content: center; flex-direction: column;
            font-size: 9px; letter-spacing: 1px; color: #8a8a84; cursor: pointer; }
    .home.down { background: #2a2a2e; box-shadow: inset 0 0 0 2px #707070; }
    .home small { font-size: 8px; color: #55554f; letter-spacing: 0; margin-top: 2px; }
    #keys { position: absolute; left: 16px; top: 198px; width: 668px; height: 188px; }
    .key { position: absolute; width: 44px; height: 44px; border-radius: 7px; background: #1a1a1d; box-shadow: inset 0 0 0 1px #29292d;
           cursor: pointer; overflow: hidden; }
    .key .glow { position: absolute; inset: 0; border-radius: 7px; background: #fff6e0; opacity: 0; }
    .key.down { box-shadow: inset 0 0 0 2px #9a9a96; }
    .key.latched { box-shadow: inset 0 0 0 2px #ffd030; }
    .key .cap { position: absolute; left: 6px; top: 5px; font-size: 11px; color: #d8d8d0; mix-blend-mode: difference; }
    .key .pc { position: absolute; right: 5px; bottom: 4px; font-size: 7px; color: #6a6a66; mix-blend-mode: difference; }
    #console { position: fixed; left: 0; right: 0; bottom: 0; max-height: 38%; margin: 0; padding: 6px 8px; overflow: auto;
               background: rgba(0, 0, 0, 0.86); color: #b8c8b8; font-size: 10px; line-height: 1.35; white-space: pre-wrap; z-index: 2; }
    #console[hidden] { display: none; }
  </style>
</head>
<body data-module="@CARDENZA_MODULE@" data-title="@CARDENZA_TITLE@" data-version="@CARDENZA_VERSION@">
  <noscript>This Cardenza simulator needs JavaScript.</noscript>
  <script src="cardenza-sim.js"></script>
</body>
</html>
